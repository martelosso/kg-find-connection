<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six Degrees of Knowledge</title>
<link rel="stylesheet" href="/vendor/codemirror/codemirror.min.css">
<link rel="stylesheet" href="/css/workbench.css">
<script src="/vendor/codemirror/codemirror.min.js"></script>
<script src="/vendor/vis-network.min.js"></script>
<script type="module" src="/js/main.js"></script>
</head>
<body>

<header id="toolbar">
  <span class="wordmark">Six Degrees of Knowledge</span>
  <div class="sep"></div>
  <div class="picker" id="pick-source"></div>
  <span class="arrow">↔</span>
  <div class="picker" id="pick-target"></div>
  <select id="mode" title="Exploration strategy">
    <option value="agent">AI agent</option>
    <option value="deterministic" selected>Deterministic (no AI)</option>
  </select>
  <div class="groups" id="groups" title="Relationship groups the search may use"></div>
  <button class="btn primary" id="go" type="button">Explore</button>
  <button class="btn" id="cancel" type="button" disabled>Cancel</button>
  <button class="btn" id="reset" type="button">Reset</button>
  <div class="sep"></div>
  <select id="replay" title="Play back a recorded demo case" disabled><option value="">Replay…</option></select>
  <div class="spacer"></div>
  <span class="badge idle" id="badge-mode">IDLE</span>
  <span class="badge det" id="badge-strategy" hidden></span>
</header>

<div id="main">
  <section id="epane" aria-label="Turtle source">
    <div class="pane-bar">
      Source <span class="fname">Turtle</span> <span class="muted" id="src-scope"></span>
      <span class="spacer"></span>
      <span class="pill warn" id="src-dirty" hidden>edited</span>
      <button class="mini" id="src-stale" hidden title="The graph grew while you were editing">reload</button>
    </div>
    <div id="cm-wrap"></div>
    <div class="pane-foot">
      <span class="sd" id="parse-dot"></span><span id="parse-text">No source yet</span>
      <span class="spacer"></span>
      <button class="mini" id="add-sandbox" type="button" title="Insert a hypothetical edge (select two nodes in the graph first)">+ sandbox edge</button>
      <button class="mini" id="apply-sandbox" type="button" disabled title="Recompute paths with your sbx: edges (never changes Wikidata facts)">Apply sandbox</button>
      <button class="mini" id="clear-sandbox" type="button" disabled>Clear</button>
      <button class="mini" id="src-reload" type="button" title="Discard edits and reload the generated Turtle">Reload</button>
    </div>
  </section>
  <div id="drag" title="Drag to resize"></div>

  <section id="gpane" aria-label="Graph">
    <div class="pane-bar">
      Graph <span class="muted" id="counts"></span>
      <span class="spacer"></span>
      <button class="mini" id="show-all" hidden type="button"></button>
      <button class="mini on" id="toggle-src" type="button" title="Show or hide the Turtle source pane">Source</button>
      <button class="mini" id="fit" type="button">Fit</button>
    </div>
    <div id="net-wrap">
      <div id="network"></div>
      <div id="inspector" class="card" hidden></div>
      <div id="legend">
        <span><i class="dot" style="background:var(--c-source)"></i>source</span>
        <span><i class="dot" style="background:var(--c-target)"></i>target</span>
        <span><i class="dot" style="background:var(--c-person)"></i>person</span>
        <span><i class="sq" style="background:var(--c-org)"></i>organization</span>
        <span><i class="sq" style="background:var(--c-work)"></i>film / music</span>
        <span><i class="ln" style="background:var(--c-shortest)"></i>shortest</span>
        <span><i class="ln" style="background:var(--c-strongest)"></i>strongest</span>
        <span><i class="ln dash" style="border-color:var(--c-sandbox)"></i>sandbox</span>
      </div>
    </div>
  </section>

  <aside id="side">
    <section class="side-sec" id="paths-sec">
      <div class="pane-bar">Result</div>
      <div id="paths"></div>
    </section>
    <section class="side-sec grow">
      <div class="pane-bar">Investigation timeline</div>
      <ol id="timeline"></ol>
    </section>
  </aside>
</div>

<footer id="statusbar">
  <span class="si"><span class="sd idle" id="run-dot"></span><span id="run-text">Pick two people and press Explore, or choose a replay.</span></span>
  <span class="spacer"></span>
  <span class="si muted" id="provider"></span>
  <span class="si"><span class="sd" id="conn"></span><span id="conn-text">Connecting…</span></span>
</footer>
</body>
</html>
