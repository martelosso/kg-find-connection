<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six Degrees of Knowledge</title>
<link rel="stylesheet" href="/vendor/codemirror/codemirror.min.css">
<link rel="stylesheet" href="/css/workbench.css">
<script src="/vendor/codemirror/codemirror.min.js"></script>
<script src="/vendor/vis-network.min.js"></script>
<script type="module" src="/js/main.js"></script>
</head>
<body class="src-min side-min">

<header id="toolbar">
  <span class="wordmark">Six Degrees of Knowledge</span>
  <div class="sep"></div>
  <div class="picker" id="pick-source"></div>
  <span class="arrow">↔</span>
  <div class="picker" id="pick-target"></div>
  <div class="seg" id="mode" role="radiogroup" title="Who chooses each expansion: the LLM agent, or the deterministic baseline">
    <button type="button" role="radio" data-mode="agent">LLM agent</button>
    <button type="button" role="radio" data-mode="deterministic" class="on">Baseline</button>
  </div>
  <div class="menu" id="groups-menu">
    <button class="btn" id="groups-btn" type="button" aria-haspopup="true" aria-expanded="false"
            title="Relation groups (sets of Wikidata properties) the search may use">Relations <span class="count" id="groups-count"></span> ▾</button>
    <div class="menu-panel card" id="groups" hidden></div>
  </div>
  <div class="menu" id="options-menu">
    <button class="btn" id="options-btn" type="button" aria-haspopup="true" aria-expanded="false"
            title="Budgets for the next run: tool calls, model turns, expansions, size and time">Options <span class="count" id="options-count" hidden></span> ▾</button>
    <div class="menu-panel card" id="options" hidden></div>
  </div>
  <button class="btn primary" id="go" type="button">Explore</button>
  <button class="btn" id="reset" type="button" title="Clear the graph and both people">Reset</button>
  <div class="sep"></div>
  <select id="replay" title="Play back a recorded demo case" disabled><option value="">Demo replays…</option></select>
  <div class="spacer"></div>
  <span class="badge" id="badge-mode" hidden></span>
  <span class="badge det" id="badge-strategy" hidden></span>
</header>

<div id="main">
  <section id="epane" aria-label="Turtle source">
    <div class="pane-bar">
      <span class="ptitle">Source</span> <span class="fname" id="src-fname">Turtle</span> <span class="muted" id="src-scope"></span>
      <span class="spacer"></span>
      <span class="pill warn" id="src-dirty" hidden>edited</span>
      <button class="mini" id="src-stale" hidden title="The graph grew while you were editing">reload</button>
      <button class="mini min" id="src-min" type="button" title="Expand the source pane">+</button>
    </div>
    <div id="cm-wrap"></div>
    <div id="onto-cm"></div>
    <div class="pane-foot">
      <span class="sd" id="parse-dot"></span><span id="parse-text">No source yet</span>
      <span class="spacer"></span>
      <button class="mini" id="add-sandbox" type="button" title="Insert a hypothetical edge (select two nodes in the graph first)">+ sandbox edge</button>
      <button class="mini" id="apply-sandbox" type="button" disabled title="Recompute paths with your sbx: edges (never changes Wikidata facts)">Apply sandbox</button>
      <button class="mini" id="clear-sandbox" type="button" disabled>Clear</button>
      <button class="mini" id="src-reload" type="button" title="Discard edits and reload the generated Turtle">Reload</button>
    </div>
  </section>
  <div id="drag" title="Drag to resize"></div>

  <section id="gpane" aria-label="Graph">
    <div class="pane-bar">
      Graph <span class="muted" id="counts"></span>
      <span class="spacer"></span>
      <div class="seg small" id="view-seg" role="radiogroup" title="Data: the explored statements · Ontology: the classes and relations they are allowed to use">
        <button type="button" role="radio" data-view="data" class="on" aria-checked="true">Data</button>
        <button type="button" role="radio" data-view="ontology" aria-checked="false">Ontology</button>
      </div>
      <button class="mini" id="show-all" hidden type="button"></button>
      <button class="mini" id="fit" type="button">Fit</button>
    </div>
    <div id="net-wrap">
      <div id="network"></div>
      <div id="overlays">
      <div id="step-card" class="card" hidden aria-live="polite">
        <div class="step-head">
          <span id="step-title">Step</span>
          <span class="muted small" id="step-sub"></span>
          <span class="spacer"></span>
          <button class="btn" id="step-back" type="button" title="Previous step (← or Page Up)">◀ Back</button>
          <button class="btn primary" id="step-next" type="button" title="Next step (→, Space or Page Down)">Next ▶</button>
          <button class="mini min" id="step-min" type="button" title="Minimize this card (Back / Next stay available)">−</button>
        </div>
        <div id="step-progress" title="Progress through the run"><i></i></div>
        <div id="step-body"></div>
      </div>
      </div>
      <div id="ontology-view">
        <div id="onto-net"></div>
        <div id="onto-caption" class="card"></div>
      </div>
      <div id="inspector" class="card" hidden></div>
      <div id="legend">
        <span data-icon="source">source</span>
        <span data-icon="target">target</span>
        <span data-icon="person">person</span>
        <span data-icon="organization">organization</span>
        <span data-icon="work">film / music</span>
        <span data-icon="place">place</span>
        <span><i class="road" style="background:var(--road)"></i>explored</span>
        <span><i class="road" style="background:var(--c-fresh)"></i>new · next</span>
        <span><i class="road" style="background:var(--c-strongest);box-shadow:0 0 0 2px var(--highway-rim)"></i>strongest path</span>
        <span><i class="road dash"></i>sandbox</span>
      </div>
    </div>
  </section>

  <aside id="side">
    <section class="side-sec" id="paths-sec">
      <div class="pane-bar"><span class="ptitle">History</span><span class="spacer"></span>
        <button class="mini min" id="side-min" type="button" title="Expand the history (result and timeline)">+</button></div>
      <div id="paths"></div>
    </section>
    <section class="side-sec grow">
      <div class="pane-bar">Investigation timeline</div>
      <ol id="timeline"></ol>
    </section>
  </aside>
</div>

<footer id="statusbar">
  <span class="si"><span class="sd idle" id="run-dot"></span><span id="run-text">Pick two people and press Explore, or choose a replay.</span></span>
  <span class="spacer"></span>
  <span class="si muted" id="provider"></span>
  <span class="si"><span class="sd" id="conn"></span><span id="conn-text">Connecting…</span></span>
</footer>
</body>
</html>
