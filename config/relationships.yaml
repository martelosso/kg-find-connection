# Relationship policy for Six Degrees of Knowledge.
#
# Ranking/search POLICY only — not facts (data/wikidata/) and not ontology semantics
# (ontology/people_connections.ttl). Bump `version` whenever a value changes; path results
# record the version that produced them.
#
# strength: semantic relevance of the relationship TYPE in (0, 1]. It is NOT confidence that
#           a Wikidata claim is true. Values below are PROVISIONAL starting points (2026-11-12),
#           to be validated against the full people graph and the demo pairs.
# Every allowlisted property is traversable in both directions for connectivity; the original
# Wikidata direction is preserved and shown (reverse hops use `inverse_label`).

version: 5
# v2 (2026-11-13): + P40 child, P451 unmarried partner, P1038 relative, P54 sports team.
# v3 (2026-11-13): + works group (film/music credits, stored on the WORK and pointing at the
#   person), doctoral advisor/student and "student" in mentorship, "founded by" in institutional,
#   and four weak groups that are off by default (birthplace, awards, party, influence).
# v4 (2026-11-13): birthplace ON by default (connects ~half of all people; strength 0.10 keeps it
#   out of strongest paths when anything better exists), with a lower hub cap for places
#   (max_intermediate_degree_by_kind.place) so only small towns can act as connectors.
# v5 (2026-11-13): no value changed here, but the graph build now classifies a node as a place
#   when birthplace links are at least half its links. Before, any city with one employer/school/
#   team link became an "organization" and escaped the place cap (225 cities with 1,000–5,000
#   links could connect people). Needs a rebuild of data/wikidata/people_graph.sqlite.

groups:
  family:
    label: Family
    label_es: Familia
    description: Family, partners and relatives recorded on a person.
    enabled_by_default: true
  mentorship:
    label: Teacher / student
    label_es: Maestro / alumno
    description: Recorded academic or artistic teacher-student relationships.
    enabled_by_default: true
  institutional:
    label: Shared institution
    label_es: Institución compartida
    description: >-
      Person -> organization links (employer, school, membership, sports team). Two people
      linked through an organization share an affiliation; this is an association, NOT
      evidence that they met.
    enabled_by_default: true
  works:
    label: Shared film / music
    label_es: Obra compartida (cine / música)
    description: >-
      Credits recorded on a film, series, song or album (cast, director, screenwriter, composer,
      performer). Two people credited on the same work probably worked together, but a shared
      credit is still an association, not proof that they met.
    enabled_by_default: true
  position:
    label: Position held (weak)
    label_es: Cargo ocupado (débil)
    description: >-
      Person -> role links (e.g. a parliamentary seat). Very high-degree role nodes; weak
      association only. Off by default; the presenter can enable it.
    enabled_by_default: false
  birthplace:
    label: Birthplace (weak)
    label_es: Lugar de nacimiento (débil)
    description: >-
      Person -> place of birth. Being born in the same city says nothing about knowing each other;
      a fun but weak link. Places have their own, lower hub cap, so only small towns connect.
    enabled_by_default: true
  awards:
    label: Awards (weak)
    label_es: Premios (débil)
    description: >-
      Person -> award received (e.g. a Nobel Prize, a Grammy category). Shared recognition, not
      contact. Off by default.
    enabled_by_default: false
  party:
    label: Political party (weak)
    label_es: Partido político (débil)
    description: >-
      Person -> political party membership. Large parties are hubs. Off by default.
    enabled_by_default: false
  influence:
    label: Influence (weak)
    label_es: Influencia (débil)
    description: >-
      "Influenced by" between people: an intellectual influence recorded in Wikidata, often across
      centuries. Not contact. Off by default.
    enabled_by_default: false

properties:
  P26:
    label: spouse
    label_es: cónyuge
    inverse_label: spouse
    inverse_label_es: cónyuge
    group: family
    strength: 0.95
    symmetric: true
  P22:
    label: father
    label_es: padre
    inverse_label: child (father of)
    inverse_label_es: hijo/a (padre de)
    group: family
    strength: 0.95
  P25:
    label: mother
    label_es: madre
    inverse_label: child (mother of)
    inverse_label_es: hijo/a (madre de)
    group: family
    strength: 0.95
  P3373:
    label: sibling
    label_es: hermano/a
    inverse_label: sibling
    inverse_label_es: hermano/a
    group: family
    strength: 0.85
    symmetric: true
  P40:
    label: child
    label_es: hijo/a
    inverse_label: parent (child of)
    inverse_label_es: padre/madre (hijo/a de)
    group: family
    strength: 0.95
  P451:
    label: unmarried partner
    label_es: pareja
    inverse_label: unmarried partner
    inverse_label_es: pareja
    group: family
    strength: 0.85
    symmetric: true
  P1038:
    # Cousins, in-laws, uncles... The kinship type is a qualifier, which the truthy dump omits,
    # so this is weaker than the explicit family properties.
    label: relative
    label_es: pariente
    inverse_label: relative
    inverse_label_es: pariente
    group: family
    strength: 0.60
    symmetric: true
  P1066:
    label: student of
    label_es: alumno/a de
    inverse_label: teacher of
    inverse_label_es: maestro/a de
    group: mentorship
