    inverse_label: directed
    inverse_label_es: dirigió
    group: works
    strength: 0.50
  P58:
    label: screenwriter
    label_es: guion
    inverse_label: wrote
    inverse_label_es: escribió
    group: works
    strength: 0.50
  P86:
    label: composer
    label_es: compositor/a
    inverse_label: composed
