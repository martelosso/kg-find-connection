    label: student
    label_es: alumno/a
    inverse_label: teacher
    inverse_label_es: maestro/a
    group: mentorship
    strength: 0.80
  P184:
    label: doctoral advisor
    label_es: director/a de tesis
    inverse_label: doctoral student
    inverse_label_es: doctorando/a
    group: mentorship
    strength: 0.85
  P185:
    label: doctoral student
    label_es: doctorando/a
    inverse_label: doctoral advisor
    inverse_label_es: director/a de tesis
    group: mentorship
    strength: 0.85
  P108:
    label: employer
    label_es: empleador
    inverse_label: employed
    inverse_label_es: empleó a
    group: institutional
    strength: 0.35
  P69:
    label: educated at
    label_es: educado/a en
    inverse_label: alma mater of
    inverse_label_es: alma máter de
    group: institutional
    strength: 0.30
  P463:
    label: member of
    label_es: miembro de
    inverse_label: has member
    inverse_label_es: tiene como miembro a
    group: institutional
    strength: 0.25
  P54:
    # Teammates may have played decades apart: an association, not evidence that they met.
    label: member of sports team
    label_es: miembro del equipo deportivo
    inverse_label: had player
    inverse_label_es: tuvo como jugador/a a
    group: institutional
    strength: 0.35
  P112:
