ranking:
  # edge_cost = -ln(max(minimum_strength, strength)) + hop_penalty + hub_penalty(entered node)
  hop_penalty: 0.20
  minimum_strength: 0.05
  # hub_penalty(node) = hub_penalty_weight * ln(1 + degree), applied when a path passes THROUGH a
  # non-person node (endpoints are never penalized).
  hub_penalty_weight: 0.10

pathfinding:
  max_hops: 6
  # Non-person nodes with degree above this cannot be intermediate path nodes (null = no cap).
  # Set from the cap sweep on the full v5 graph (docs/wikidata-ingestion-decision.md): 10,000 lets
  # 10k-member academies dominate shortest paths; 2,000 loses connectivity.
  max_intermediate_degree: 5000
  # Per-kind overrides (kinds: organization, work, position, place, other). Places get a lower cap:
  # a shared birth town is a weak link, and only small ones say anything about the two people.
  max_intermediate_degree_by_kind:
    place: 1000
  # Work caps for a single path computation; hitting one yields a partial ("explored_graph") result.
  max_visited_nodes: 250000
  max_expanded_states: 250000
