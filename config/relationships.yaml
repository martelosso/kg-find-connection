    label: founded by
    label_es: fundado/a por
    inverse_label: founded
    inverse_label_es: fundó
    group: institutional
    strength: 0.40
  # ---- works: stored on the WORK, pointing at the person (work -> person) ----
  P161:
    label: cast member
    label_es: reparto
    inverse_label: acted in
    inverse_label_es: actuó en
    group: works
    strength: 0.50
  P57:
    label: director
