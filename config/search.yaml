# Investigation budgets and frontier heuristics (IMPLEMENTATION_PLAN.md §12).
#
# These are PROPOSED safeguards, not measured optima. Hitting any cap ends the investigation with
# a PARTIAL result that states the reason. The hop limit lives in relationships.yaml
# (pathfinding.max_hops) because the path engine enforces it.
# An investigation request may LOWER these values, never raise them.

version: 2
# v2 (2026-11-13): agent budgets raised above the plan's §12 table for testing on the full graph:
#   tool calls 18 -> 30, provider requests 25 -> 30, explored nodes 400 -> 600, edges 1500 -> 2000.
#   With 18 calls every agent run on the demo pairs stopped while the backend still flagged a
#   stronger path; with 30 alone, a third of runs hit the 400-node cap (royals and physicists have
#   50-120 links each). At these values Diana-Churchill and Coelho-Senna showed a stronger path
#   than the shortest in 2/2 runs each, no run hit the node cap, and runs took 18-33 s (< 90 s).
#   Provisional until step 4 (benchmark_investigations.py).

budgets:
  max_explored_nodes: 600
  max_explored_edges: 2000
  max_edges_per_expansion: 100
  max_provider_requests: 30
  max_agent_tool_calls: 30
  wall_time_seconds: 90

frontier:
  # rank_frontier score = weighted path cost from the node's side endpoint
  #                       + degree_weight * ln(1 + degree)   (prefers cheap, specific expansions)
  degree_weight: 0.15
  # After the first path appears, keep expanding this many more nodes to look for better paths.
  expansions_after_first_path: 4

agent:
  # Hard stop on model turns (each turn may contain several tool calls; tool calls are also
  # capped by budgets.max_agent_tool_calls).
  max_turns: 24
  # Stop after this many consecutive get_neighbors calls that add no new edge.
  no_progress_limit: 4
  # How many newly added nodes a get_neighbors result lists back to the model.
  max_result_nodes: 25
  # Frontier suggestions included in get_search_status.
  status_frontier_size: 8
  # Maximum length of the agent's final plain-language summary.
  max_summary_chars: 700

ui:
  # Graph nodes drawn at once. Beyond this, leaf nodes that are not on a path, not expanded and
  # not endpoints are hidden (the presenter can still show all). Plan §12.
  max_visible_nodes: 250
